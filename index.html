      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
        let paused = false;
        try { paused = localStorage.getItem('portfolio-motion') === 'paused'; } catch {}
        document.documentElement.dataset.motion = paused || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
      })();
    </script>
